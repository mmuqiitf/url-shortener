services:
  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  url-shortener:
    build:
      context: .
      dockerfile: Dockerfile
    image: url-shortener:local
    container_name: url-shortener
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DB_PATH: "/home/nonroot/shortener.db"
      BASE_URL: "${BASE_URL:-http://localhost:8080}"
      REDIS_ADDR: "redis:6379"
      TRACKER_WORKERS: "${TRACKER_WORKERS:-2}"
      TRACKER_BATCH_SIZE: "${TRACKER_BATCH_SIZE:-50}"
      TRACKER_FLUSH_INTERVAL_MS: "${TRACKER_FLUSH_INTERVAL_MS:-1000}"
      TRACKER_BUFFER: "${TRACKER_BUFFER:-4096}"
      READ_TIMEOUT_SEC: "${READ_TIMEOUT_SEC:-10}"
      WRITE_TIMEOUT_SEC: "${WRITE_TIMEOUT_SEC:-10}"
      IDLE_TIMEOUT_SEC: "${IDLE_TIMEOUT_SEC:-120}"
    volumes:
      - shortener-data:/home/nonroot

volumes:
  shortener-data:
    name: url-shortener-data
  redis-data:
    name: url-shortener-redis-data
